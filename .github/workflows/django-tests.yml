name: Validación Django

on:
  push:
    branches: [django-migration, main]
    paths:
      - 'django_app/**'
      - 'queue_core.py'
      - 'interpretation_core.py'
      - '.github/workflows/django-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'django_app/**'
      - 'queue_core.py'
      - 'interpretation_core.py'

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: django_app/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r django_app/requirements.txt
      - name: Django system check
        working-directory: django_app
        run: python manage.py check
      - name: Migration drift check
        working-directory: django_app
        run: python manage.py makemigrations --check --dry-run
      - name: Production deploy check
        working-directory: django_app
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-long-secret-key-not-for-production-0123456789"
          DJANGO_ALLOWED_HOSTS: "example.test"
          DJANGO_SECURE_SSL_REDIRECT: "0"
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
      - name: Challenge JavaScript syntax
        run: |
          node --check django_app/static/js/challenge.js
          node --check django_app/static/js/classic-lab.js
          node --check django_app/static/js/simulator.js
          node --check django_app/static/js/dynamic-scene.js
          node --check django_app/static/js/network.js
      - name: Django tests
        working-directory: django_app
        run: python manage.py test
