name: Validación Django

on:
  push:
    branches: [django-migration, main]
    paths:
      - 'django_app/**'
      - 'queue_core.py'
      - 'interpretation_core.py'
      - '.github/workflows/django-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'django_app/**'
      - 'queue_core.py'
      - 'interpretation_core.py'

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: django_app/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r django_app/requirements.txt
      - name: Django system check
        working-directory: django_app
        run: python manage.py check
      - name: Django tests
        working-directory: django_app
        run: python manage.py test
