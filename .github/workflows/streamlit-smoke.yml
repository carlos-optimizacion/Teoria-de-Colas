name: Validación Streamlit
on:
  push:
    branches: [feature/decision-lab-challenge-2, main]
    paths:
      - 'streamlit_app.py'
      - 'home.py'
      - 'streamlit_v3.py'
      - 'experiment_registry_v3.py'
      - 'tests/test_experiment_registry_v3.py'
      - 'tests/test_four_module_nav_v3.py'
      - 'report_v3.py'
      - 'django_app/portal/empirical_v3.py'
      - 'django_app/portal/queue_v3.py'
      - 'tests/test_queue_v3.py'
      - 'tests/test_active_queue_sectors.py'
      - 'tests/test_challenge_bridge_v3.py'
      - 'tests/test_empirical_report_v3.py'
      - 'tests_browser/v3_streamlit_smoke.py'
      - 'tests_browser/v3_active_sectors_smoke.py'
      - 'bank_three_scene.py'
      - 'sector_scenes_v3.py'
      - 'tests/test_bank_three_scene.py'
      - 'streamlit_sector_scenes.py'
      - 'streamlit_visual_logic.py'
      - 'tests/test_streamlit_sector_scenes.py'
      - 'django_app/static/img/scenarios_hd/**'
      - 'queue_core.py'
      - 'django_app/portal/challenge_engine.py'
      - 'django_app/portal/queue_v3.py'
      - 'tests/test_queue_v3.py'
      - 'django_app/portal/network_engine.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - '.github/workflows/streamlit-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'home.py'
      - 'sector_scenes_v3.py'
      - 'bank_three_scene.py'
      - 'tests/test_bank_three_scene.py'
      - 'tests_browser/v3_active_sectors_smoke.py'
      - 'queue_core.py'
      - 'django_app/portal/challenge_engine.py'
      - 'django_app/portal/network_engine.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - '.github/workflows/streamlit-smoke.yml'
  workflow_dispatch:

jobs:
  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Syntax/import checks
        run: |
          python -m py_compile experiment_registry_v3.py sector_scenes_v3.py home.py streamlit_v3.py report_v3.py django_app/portal/empirical_v3.py django_app/portal/queue_v3.py streamlit_app.py bank_three_scene.py streamlit_sector_scenes.py streamlit_visual_logic.py queue_core.py django_app/portal/challenge_engine.py django_app/portal/network_engine.py
          python -m pytest -q tests/test_challenge_bridge_v3.py tests/test_four_module_nav_v3.py tests/test_experiment_registry_v3.py tests/test_active_queue_sectors.py tests/test_queue_v3.py tests/test_empirical_report_v3.py tests/test_bank_three_scene.py tests/test_streamlit_visual_logic.py tests/test_streamlit_sector_scenes.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'django_app')
          from portal.challenge_engine import evaluate_game
          from portal.network_engine import simulate_network
          r=evaluate_game({'scenario':'banco','staffing':[3]*8,'replications':2,'seed':2026})
          assert 0 <= r['score'] <= 100
          n=simulate_network({'arrival_min':5,'horizon':120,'stages':[{'name':'A','service_min':4,'servers':2},{'name':'B','service_min':7,'servers':2}]})
          assert n['arrivals'] == n['completed'] + n['in_system_at_close']
          print('Engine smoke OK')
          PY
      - name: Challenge H2 engine switching UI
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("streamlit_app.py")
          at.run(timeout=40)
          next(r for r in at.radio if r.label=="Navegación").set_value("Desafíos gerenciales")
          at.run(timeout=40)
          assert not at.exception,at.exception
          choice=next(x for x in at.selectbox if x.label=="Incidente del desafío")
          assert "none" in choice.options and "demanda" in choice.options
          choice.set_value("none")
          at.run(timeout=40)
          next(b for b in at.button if b.label=="Guardar y validar configuración").click()
          at.run(timeout=60)
          assert not at.exception,at.exception
          assert at.session_state["result"]["engine"]=="queue_v3"
          assert at.session_state["result"]["events"][-1]["t"]==480
          assert any(b.label=="Abrir simulación ▶" for b in at.button)
          print("H2 Challenge UI: ruta motor central y vista previa correctas")
          PY
      - name: Streamlit AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("streamlit_app.py")
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          assert len(at.radio) >= 1
          [r for r in at.radio if r.label=="Navegación"][0].set_value("Desafíos gerenciales")
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          labels=[b.label for b in at.button]
          assert "Abrir simulación ▶" not in labels
          assert "▶ Iniciar simulación desde 0 min" not in labels
          forms=[b for b in at.button if b.label=="Guardar y validar configuración"]
          assert forms, labels
          forms[0].click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          labels=[b.label for b in at.button]
          assert "Abrir simulación ▶" in labels, labels
          assert "▶ Iniciar simulación desde 0 min" not in labels, labels
          [b for b in at.button if b.label=="Abrir simulación ▶"][0].click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          labels=[b.label for b in at.button]
          assert "▶ Iniciar simulación desde 0 min" in labels, labels
          assert "Guardar y validar configuración" not in labels, labels
          preview_text="\n".join(m.value for m in at.markdown)
          assert "BANCO 3D" in preview_text, "Falta el encabezado de la previsualización 3D"
          assert "sector-scene sector-banco" not in preview_text, "Regresión: vista 2D anterior"
          assert any(x.type=="iframe" for x in at), "No se montó el reproductor Three.js"
          start=[b for b in at.button if b.label=="▶ Iniciar simulación desde 0 min"][0]
          start.click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          running_text="\n".join(m.value for m in at.markdown)
          assert any(x.type=="iframe" for x in at), "No se montó el reproductor 3D durante la simulación"
          assert "sector-scene sector-banco" not in running_text, "Regresión a la escena 2D"
          print("AppTest workflow OK: config -> preview 3D -> player 3D; legacy 2D absent")
          PY
      - name: Validate model selector and adaptive forms
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("streamlit_app.py")
          at.run(timeout=45)
          nav=[r for r in at.radio if r.label=="Navegación"][0]
          nav.set_value("Simulador 3D")
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert [r for r in at.radio if r.label=="Tipo de simulación"]
          model=[x for x in at.selectbox if x.label=="Modelo matemático"][0]
          assert "D/D/c" in model.options
          labels=[x.label for x in at.number_input]
          assert "Tiempo fijo de atención (min)" in labels
          assert "Tiempo medio de atención (min)" not in labels
          [r for r in at.radio if r.label=="Tipo de simulación"][0].set_value("parametric")
          at.run(timeout=45)
          assert not at.exception,at.exception
          model=[x for x in at.selectbox if x.label=="Modelo matemático"][0]
          assert "M/M/c/K" in model.options and "D/D/c" not in model.options
          model.set_value("M/M/c/K")
          at.run(timeout=45)
          assert not at.exception,at.exception
          labels=[x.label for x in at.number_input]
          assert "Tiempo medio de atención (min)" in labels
          assert "Tiempo fijo de atención (min)" not in labels
          assert "Capacidad máxima del sistema (K: espera + atención)" in labels
          assert not any(x.type=="iframe" for x in at)
          [r for r in at.radio if r.label=="Tipo de simulación"][0].set_value("empirical")
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert any(x.type=="file_uploader" for x in at)
          assert "Tiempo medio de atención (min)" not in [x.label for x in at.number_input]
          assert "G/G/c" in [x for x in at.selectbox if x.label=="Modelo matemático"][0].options
          assert not any(x.type=="iframe" for x in at)
          print("Model selector v3: deterministic, parametric M/M/c/K, empirical upload OK")
          PY
      - name: Verify interactive arrival alternatives and mathematical equivalence
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          def configure():
              at=AppTest.from_file("streamlit_app.py")
              at.run(timeout=45)
              next(r for r in at.radio if r.label=="Navegación").set_value("Simulador 3D")
              at.run(timeout=45)
              assert not at.exception,at.exception
              return at
          at=configure()
          def demand_inputs(a):
              return {x.label:x for x in a.number_input}
          way=next(r for r in at.radio if r.label=="¿Cómo prefieres describir las llegadas?")
          assert way.value=="Cantidad de clientes por intervalo"
          assert "Clientes que llegan" in demand_inputs(at)
          assert "Durante cuántos minutos" in demand_inputs(at)
          assert "Tiempo entre llegadas (min)" not in demand_inputs(at)
          demand_inputs(at)["Clientes que llegan"].set_value(15)
          demand_inputs(at)["Durante cuántos minutos"].set_value(60.)
          at.run(timeout=45)
          assert not at.exception,at.exception
          next(r for r in at.radio if r.label=="¿Cómo prefieres describir las llegadas?").set_value("Tiempo entre llegadas")
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert "Tiempo entre llegadas (min)" in demand_inputs(at)
          assert "Clientes que llegan" not in demand_inputs(at)
          assert "Durante cuántos minutos" not in demand_inputs(at)
          demand_inputs(at)["Tiempo entre llegadas (min)"].set_value(4.)
          at.run(timeout=45)
          assert not at.exception,at.exception
          next(r for r in at.radio if r.label=="¿Cómo prefieres describir las llegadas?").set_value("Cantidad de clientes por intervalo")
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert demand_inputs(at)["Clientes que llegan"].value==15
          assert demand_inputs(at)["Durante cuántos minutos"].value==60.
          [b for b in at.button if b.label=="Guardar y validar configuración"][0].click()
          at.run(timeout=45)
          assert not at.exception,at.exception
          count_gap=at.session_state["v3_payload"]["arrival_mean"]
          assert abs(count_gap-4.0)<1e-10,count_gap
          other=configure()
          next(r for r in other.radio if r.label=="¿Cómo prefieres describir las llegadas?").set_value("Tiempo entre llegadas")
          other.run(timeout=45)
          demand_inputs(other)["Tiempo entre llegadas (min)"].set_value(4.)
          other.run(timeout=45)
          [b for b in other.button if b.label=="Guardar y validar configuración"][0].click()
          other.run(timeout=45)
          assert not other.exception,other.exception
          direct_gap=other.session_state["v3_payload"]["arrival_mean"]
          assert abs(direct_gap-count_gap)<1e-10,(direct_gap,count_gap)
          print("Reactivo OK: dos interfaces distintas y misma llegada media 4 min")
          PY
      - name: Cross-module navigation and four-sector simulation regression
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          sections=["Simulador 3D","Desafíos gerenciales","Red de colas","Análisis y reportes"]
          for section in sections:
              app=AppTest.from_file("streamlit_app.py")
              app.run(timeout=45)
              nav=next(r for r in app.radio if r.label=="Navegación")
              nav.set_value(section)
              app.run(timeout=60)
              assert not app.exception, f"Sección {section}: {app.exception}"
              if section=="Desafíos gerenciales":
                  choices=[b.label for b in app.button if b.key and str(b.key).startswith("scene_")]
                  assert len(choices)==4, choices
                  assert not any("Manufactura" in x for x in choices)
              if section=="Simulador 3D":
                  selection=next(x for x in app.selectbox if x.label=="Escenario operativo")
                  assert selection.options==["Banca","Salud","Retail","Logística"],selection.options
              print("OK módulo:", section)
          for sector in ("banco","hospital","supermercado","logistica"):
              at=AppTest.from_file("streamlit_app.py")
              at.run(timeout=45)
              [r for r in at.radio if r.label=="Navegación"][0].set_value("Simulador 3D")
              at.run(timeout=45)
              [x for x in at.selectbox if x.label=="Escenario operativo"][0].set_value(sector)
              at.run(timeout=45)
              assert not at.exception, (sector, at.exception)
              [b for b in at.button if b.label=="Guardar y validar configuración"][0].click()
              at.run(timeout=60)
              assert not at.exception, (sector,at.exception)
              assert at.session_state["v3_scenario"]==sector
              assert len(at.session_state["v3_registry"])==1, (sector,"No se registró el experimento")
              assert at.session_state["v3_registry"][0]["sector"]==sector
              assert any(x.type=="iframe" for x in at), f"Falta previsualización 3D: {sector}"
              assert at.session_state["v3_step"]=="preview", (sector,at.session_state["v3_step"])
              assert any(b.label=="▶ Iniciar simulación desde 0 min" for b in at.button), sector
              print("OK sector:",sector)
          PY
      - name: Integrated 3.0 AppTest (data first, 3D second, reports last)
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("streamlit_app.py")
          at.run(timeout=45)
          [r for r in at.radio if r.label=="Navegación"][0].set_value("Simulador 3D")
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert any(b.label=="Guardar y validar configuración" for b in at.button)
          assert not any(x.type=="iframe" for x in at), "La vista 3D apareció antes de configurar"
          [b for b in at.button if b.label=="Guardar y validar configuración"][0].click()
          at.run(timeout=45)
          assert not at.exception,at.exception
          assert any(b.label=="▶ Iniciar simulación desde 0 min" for b in at.button)
          assert any(x.type=="iframe" for x in at), "El banco no mostró previsualización 3D"
          # AppTest v1.49 puede invalidar IDs de widgets al desmontar un formulario.
          # Verificar la ruta de ejecución con una sesión de prueba nueva,
          # conservando los datos validados de la previsualización.
          result=at.session_state["v3_result"]
          payload=at.session_state["v3_payload"]
          sector=at.session_state["v3_scenario"]
          player=AppTest.from_file("streamlit_app.py")
          player.session_state["v3_step"]="run"
          player.session_state["v3_result"]=result
          player.session_state["v3_payload"]=payload
          player.session_state["v3_scenario"]=sector
          player.run(timeout=60)
          [r for r in player.radio if r.label=="Navegación"][0].set_value("Simulador 3D")
          player.run(timeout=90)
          assert not player.exception,player.exception
          assert any(x.type=="iframe" for x in player)
          if result["model"] in {"D/D/1","M/M/1","M/M/1/K","M/G/1","G/G/1"}:
              assert not any(b.label=="Optimizar capacidad por SLA y costo" for b in player.button)
          else:
              assert any(b.label=="Optimizar capacidad por SLA y costo" for b in player.button)
          assert sum(1 for x in player if x.type=="download_button")==3, "PDF, Excel y JSON deben estar disponibles"
          assert len(at.session_state["v3_registry"])==1
          print("Decision Lab 3.0 reports and data-first flow OK")
          print("Decision Lab 3.0 AppTest OK")
          PY
      - name: Start Streamlit
        run: |
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/streamlit.log 2>&1 &
          echo $! >/tmp/streamlit.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Verify app HTML
        run: |
          curl -fsS http://127.0.0.1:8501/ | grep -q "Streamlit"
      - name: Install Chromium browser automation
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual Streamlit + Three.js browser smoke
        run: |
          python tests_browser/v3_streamlit_smoke.py
          python tests_browser/v3_active_sectors_smoke.py
      - name: Upload decision lab 3.0 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-lab-3-webgl-ui
          path: visual-artifacts/
          if-no-files-found: ignore
      - name: Print log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
