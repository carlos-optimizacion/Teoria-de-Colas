name: Validación Streamlit
on:
  push:
    branches: [feature/decision-lab-challenge-2, main]
    paths:
      - 'streamlit_app.py'
      - 'bank_three_scene.py'
      - 'tests/test_bank_three_scene.py'
      - 'streamlit_sector_scenes.py'
      - 'streamlit_visual_logic.py'
      - 'tests/test_streamlit_sector_scenes.py'
      - 'django_app/static/img/scenarios_hd/**'
      - 'queue_core.py'
      - 'django_app/portal/challenge_engine.py'
      - 'django_app/portal/network_engine.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - '.github/workflows/streamlit-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'queue_core.py'
      - 'django_app/portal/challenge_engine.py'
      - 'django_app/portal/network_engine.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - '.github/workflows/streamlit-smoke.yml'
  workflow_dispatch:

jobs:
  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Syntax/import checks
        run: |
          python -m py_compile streamlit_app.py bank_three_scene.py streamlit_sector_scenes.py streamlit_visual_logic.py queue_core.py django_app/portal/challenge_engine.py django_app/portal/network_engine.py
          python -m pytest -q tests/test_bank_three_scene.py tests/test_streamlit_visual_logic.py tests/test_streamlit_sector_scenes.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'django_app')
          from portal.challenge_engine import evaluate_game
          from portal.network_engine import simulate_network
          r=evaluate_game({'scenario':'banco','staffing':[3]*8,'replications':2,'seed':2026})
          assert 0 <= r['score'] <= 100
          n=simulate_network({'arrival_min':5,'horizon':120,'stages':[{'name':'A','service_min':4,'servers':2},{'name':'B','service_min':7,'servers':2}]})
          assert n['arrivals'] == n['completed'] + n['in_system_at_close']
          print('Engine smoke OK')
          PY
      - name: Streamlit AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file("streamlit_app.py")
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          assert len(at.radio) >= 1
          labels=[b.label for b in at.button]
          assert "Abrir simulación ▶" not in labels
          assert "▶ Iniciar simulación desde 0 min" not in labels
          forms=[b for b in at.button if b.label=="Guardar y validar configuración"]
          assert forms, labels
          forms[0].click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          labels=[b.label for b in at.button]
          assert "Abrir simulación ▶" in labels, labels
          assert "▶ Iniciar simulación desde 0 min" not in labels, labels
          [b for b in at.button if b.label=="Abrir simulación ▶"][0].click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          labels=[b.label for b in at.button]
          assert "▶ Iniciar simulación desde 0 min" in labels, labels
          assert "Guardar y validar configuración" not in labels, labels
          preview_text="\n".join(m.value for m in at.markdown)
          print("PREVIEW MARKDOWN DIAGNOSTIC:", repr(preview_text[-5500:]))
          print("PREVIEW MARKDOWN COUNT:", len(at.markdown))
          assert "BANCO 3D" in preview_text, "No se mostró el encabezado Banco 3D"
          assert "sector-scene sector-banco" not in preview_text, "Regresión: se mostró la vista antigua 2D"
          start=[b for b in at.button if b.label=="▶ Iniciar simulación desde 0 min"][0]
          start.click()
          at.run(timeout=30)
          if at.exception:
              raise AssertionError(at.exception)
          running_text="\n".join(m.value for m in at.markdown)
          assert "BANCO 3D" in running_text
          assert "sector-scene sector-banco" not in running_text
          print("AppTest workflow OK: config -> preview 3D -> player 3D; legacy 2D absent")
          PY
      - name: Start Streamlit
        run: |
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/streamlit.log 2>&1 &
          echo $! >/tmp/streamlit.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Verify app HTML
        run: |
          curl -fsS http://127.0.0.1:8501/ | grep -q "Streamlit"
      - name: Print log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
