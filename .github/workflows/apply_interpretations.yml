name: Aplicar interpretaciones educativas

on:
  push:
    branches: [mejora-arquitectura-validacion]
    paths:
      - tools/apply_interpretations.py
      - .github/workflows/apply_interpretations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mejora-arquitectura-validacion
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Aplicar interpretaciones
        run: python tools/apply_interpretations.py

      - name: Validar sintaxis y pruebas
        run: |
          python -m compileall -q home.py queue_core.py interpretation_core.py pages tests
          python -m pytest -q
          git diff --check

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interpretation_core.py pages
          git commit -m "Integra interpretaciones educativas en laboratorios"
          git push origin HEAD:mejora-arquitectura-validacion
